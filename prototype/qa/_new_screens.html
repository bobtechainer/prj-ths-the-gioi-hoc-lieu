<!-- ════════ 0 · CHỌN CHỦ ĐỀ ════════ -->
<section id="scr-topic" class="screen on">
  <div class="topic-wrap">
    <h1 class="stick" style="transform:rotate(-1deg);font-size:24px">Hôm nay bạn tò mò chuyện gì?</h1>
    <p class="topic-sub">Chọn một câu hỏi — mỗi câu là một chuyến đi</p>
    <div class="cards">
      <button class="tcard" onclick="UI.goJoin()">
        <span class="tico">🧬</span>
        <b>Làm sao tế bào biết phải làm việc gì?</b>
        <small>Sinh học 10 · Bài 8</small>
        <span class="tgo">Chơi ngay →</span>
      </button>
      <button class="tcard locked" disabled>
        <span class="tico">🌿</span>
        <b>Cây ăn gì để sống?</b>
        <small>Sinh học 11</small>
        <span class="tgo">Chưa mở</span>
      </button>
      <button class="tcard locked" disabled>
        <span class="tico">❤️</span>
        <b>Vì sao tim đập cả đời không nghỉ?</b>
        <small>Sinh học 8</small>
        <span class="tgo">Chưa mở</span>
      </button>
    </div>
  </div>
</section>

<!-- ════════ 0b · GHÉP NGƯỜI CHƠI ════════ -->
<section id="scr-join" class="screen">
  <div class="topic-wrap">
    <h1 class="stick" style="transform:rotate(-1deg);font-size:24px">Ai chơi nào?</h1>
    <p class="topic-sub">Bấm phím bất kỳ hoặc chạm vào ô để vào chơi · game này tối đa 2 người</p>
    <div class="joinrow">
      <div class="jslot" data-slot="0" onclick="UI.join(0)">
        <div class="javt" id="javt0"></div>
        <b id="jname0">Bấm để vào</b>
      </div>
      <div class="jslot" data-slot="1" onclick="UI.join(1)">
        <div class="javt" id="javt1"></div>
        <b id="jname1">Chờ người chơi 2…</b>
      </div>
      <div class="jslot off"><div class="javt"></div><b>Game này tối đa 2 người</b></div>
      <div class="jslot off"><div class="javt"></div><b>Game này tối đa 2 người</b></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:22px">
      <button class="btn ghost" onclick="UI.goTopic()">← Chọn câu khác</button>
      <button class="btn go" id="btnJoinGo" disabled onclick="UI.goGarden()">Vào khu vườn →</button>
    </div>
  </div>
</section>
